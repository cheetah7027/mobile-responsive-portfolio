<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo">
            <img src="cheetahslog.svg" alt="Personal Logo" style="color: #533E0E;">
        </div>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="nav-links">
            <a href="#home">Home</a>
            <a href="#about">About me</a>
            <a href="#resume">Resume</a>
            <a href="#hire">Hire me</a>
        </div>
    </nav>

    <div class="container">
        <div class="hero-grid">
            <div class="top-row">
                <div class="card">
                    <h2>Crafting sleek experiences, building bold products</h2>
                    <div class="arrow-button">
                        <img src="arrow.svg" alt="Arrow">
                    </div>
                </div>

                <div class="card profile-card">
                    <img src="apss.png" alt="Profile Photo">
                </div>

                <div class="card">
                    <h2>Ashwani from IIT Delhi, explore my journey</h2>
                    <div class="arrow-button">
                        <img src="arrow.svg" alt="Arrow">
                    </div>
                </div>
            </div>

            <div class="bottom-row">
                <div class="card">
                    <h2>Curious about my past experiences?</h2>
                    <div class="arrow-button">
                        <img src="arrow.svg" alt="Arrow">
                    </div>
                </div>

                <div class="card">
                    <h2>Currently working on</h2>
                    <div class="arrow-button">
                        <img src="arrow.svg" alt="Arrow">
                    </div>
                </div>

                <div class="card hire-card">
                    <h2>Want to hire me?</h2>
                    <div class="arrow-button">
                        <img src="arrow.svg" alt="Arrow">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="social-footer">
        <h3>Follow me on</h3>
        <div class="social-links">
            <a href="#" class="social-icon">
                <img src="insta.svg" alt="Instagram">
            </a>
            <a href="#" class="social-icon">
                <img src="linked.svg" alt="LinkedIn">
            </a>
            <a href="#" class="social-icon">
                <img src="pinterest.svg" alt="Pinterest">
            </a>
            <a href="#" class="social-icon">
                <img src="behand.svg" alt="Behance">
            </a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
